server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  charset utf-8;
  server_tokens off;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header X-Robots-Tag "noindex, nofollow" always;
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; base-uri 'self'; form-action 'self' mailto:; frame-ancestors 'self'; object-src 'none'" always;
  location / { try_files $uri $uri/ =404; }
  location ~* \.(?:css|js|webp|png|jpg|svg)$ { expires 30d; add_header Cache-Control "public, max-age=2592000, immutable"; }
  location = /healthz { access_log off; default_type text/plain; return 200 'ok\n'; }
  error_page 404 /404.html;
}
